<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snap!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  
  :root {
    --teal: #509689;
    --teal-light: #6db8a8;
    --teal-pale: #e8f4f1;
    --white: #ffffff;
    --cream: #faf9f7;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 60px 20px 0;
  }

  .parallax-wrapper {
    position: relative;
    width: min(520px, 90vw);
    will-change: transform;
    margin-bottom: 80px;
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .parallax-wrapper.visible {
    opacity: 1;
    transform: translateY(0px);
  }

  .photo-frame {
    width: 100%;
    aspect-ratio: 4/5;
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 4px 24px rgba(80,150,137,0.12),
      0 1px 4px rgba(0,0,0,0.06);
    position: relative;
    background: var(--teal-pale);
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    will-change: transform;
    transition: transform 0.1s linear;
  }

  .photo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--teal);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    letter-spacing: 0.05em;
  }

  .photo-placeholder svg { opacity: 0.4; }

  /* ZIGZAG */
  .zigzag-section {
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .zigzag-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .zigzag-container {
    position: relative;
    width: min(480px, 88vw);
  }

  .zigzag-svg {
    width: 100%;
    display: block;
    filter: drop-shadow(0 4px 18px rgba(80,150,137,0.18));
  }

  .zigzag-text-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18% 14%;
    text-align: center;
  }

  .pinyon-script-regular {
    font-family: "Pinyon Script", cursive;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(20px, 4.5vw, 34px);
    color: var(--cream);
    line-height: 1.6;
    letter-spacing: 0.01em;
  }

  /* CAMERA */
  .camera-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 80px;
    gap: 20px;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease 0.1s, transform 0.8s ease 0.1s;
  }

  .camera-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .camera-outer {
    width: min(360px, 88vw);
    aspect-ratio: 1;
    border-radius: 20px;
    border: 2.5px solid var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    box-shadow: 0 4px 24px rgba(80,150,137,0.13);
    position: relative;
    overflow: hidden;
  }

  .camera-inner {
    width: calc(100% - 28px);
    height: calc(100% - 28px);
    border-radius: 13px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
  }

  .camera-inner:hover .cam-prompt { transform: scale(1.05); }

  .cam-prompt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.7);
    transition: transform 0.2s;
    user-select: none;
  }

  .cam-prompt svg { opacity: 0.6; }
  .cam-prompt span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 0 20px;
  }

  #videoEl {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    transform: scaleX(-1);
  }

  #videoEl.active { display: block; }

  .snap-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--white);
    border: 3px solid var(--teal);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 2px 12px rgba(80,150,137,0.2);
  }

  .snap-btn:active { transform: scale(0.92); background: var(--teal-pale); }
  .snap-btn.show { display: flex; }

  .snap-btn-inner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--teal);
    transition: background 0.15s;
  }

  .snap-btn:active .snap-btn-inner { background: var(--teal-light); }

  #canvas { display: none; }

  /* PROGRESS */
  .progress-section {
    width: min(360px, 88vw);
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .progress-section.show { display: flex; }

  .progress-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--teal);
    letter-spacing: 0.06em;
    text-align: center;
  }

  .progress-track {
    height: 10px;
    background: var(--teal-pale);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(80,150,137,0.2);
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 99px;
    width: 0%;
    transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .variant-chips {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  .chip {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid rgba(80,150,137,0.3);
    color: rgba(80,150,137,0.4);
    letter-spacing: 0.04em;
    transition: all 0.4s ease;
  }

  .chip.unlocked {
    background: var(--teal);
    color: white;
    border-color: var(--teal);
  }

  /* SPOTIFY */
  .spotify-btn {
    display: none;
    align-items: center;
    gap: 10px;
    background: #1DB954;
    color: white;
    border: none;
    border-radius: 99px;
    padding: 14px 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    cursor: pointer;
    text-decoration: none;
    margin-top: 6px;
    box-shadow: 0 4px 16px rgba(29,185,84,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .spotify-btn:active { transform: scale(0.97); }
  .spotify-btn.show { display: flex; }

  @keyframes popIn {
    from { opacity:0; transform: scale(0.8); }
    to   { opacity:1; transform: scale(1); }
  }

  .detect-msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--teal);
    text-align: center;
    min-height: 22px;
    letter-spacing: 0.04em;
    width: min(360px, 88vw);
    transition: opacity 0.3s;
  }

  .footer-space { height: 60px; }

  .scroll-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 0 40px;
    animation: bounce 2s ease-in-out infinite;
  }

  .scroll-hint span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: rgba(80,150,137,0.6);
    letter-spacing: 0.1em;
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(6px); }
  }

  .analyzing-overlay {
    position: absolute;
    inset: 0;
    background: rgba(80,150,137,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .analyzing-overlay.show { display: flex; }

  .analyzing-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="gallery" id="gallery">

  <div class="parallax-wrapper" id="pw1">
    <div class="photo-frame">
      <img src="imgs/1.jpg.jpeg" alt="Photo 1" id="img1" onerror="this.parentNode.innerHTML=placeholderHTML(1)">
    </div>
  </div>

  <div class="scroll-hint">
    <span>scroll</span>
    <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
      <path d="M8 2v14M2 10l6 6 6-6" stroke="#509689" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="parallax-wrapper" id="pw2">
    <div class="photo-frame">
      <img src="imgs/2.jpg.jpeg" alt="Photo 2" id="img2" onerror="this.parentNode.innerHTML=placeholderHTML(2)">
    </div>
  </div>

  <div class="parallax-wrapper" id="pw3">
    <div class="photo-frame">
      <img src="imgs/3.jpg.jpeg" alt="Photo 3" id="img3" onerror="this.parentNode.innerHTML=placeholderHTML(3)">
    </div>
  </div>

</div>

<!-- ZIGZAG -->
<div class="zigzag-section" id="zigzagSection">
  <div class="zigzag-container">
    <svg class="zigzag-svg" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" id="zigzagSvg">
      <defs>
        <filter id="softShadow">
          <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#509689" flood-opacity="0.15"/>
        </filter>
      </defs>
      <path id="zigPath" fill="#509689" filter="url(#softShadow)"/>
    </svg>
    <div class="zigzag-text-overlay">
      <p class="pinyon-script-regular" id="zigzagText">
        Okay you got here yasss, now i need you to snap 3 pictures with the 3 diff. paper accesories to unlock a surprise at the end!
      </p>
    </div>
  </div>
</div>

<!-- CAMERA -->
<div class="camera-section" id="cameraSection">

  <div class="camera-outer">
    <div class="camera-inner" id="cameraInner" onclick="startCamera()">
      <div class="cam-prompt" id="camPrompt">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="25" r="9" stroke="white" stroke-width="2"/>
          <path d="M6 18c0-2.2 1.8-4 4-4h4l2-4h16l2 4h4c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H10c-2.2 0-4-1.8-4-4V18z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>Tap to enable camera</span>
      </div>
      <video id="videoEl" autoplay playsinline muted></video>
      <div class="analyzing-overlay" id="analyzingOverlay">
        <div class="analyzing-spinner"></div>
      </div>
    </div>
  </div>

  <button class="snap-btn" id="snapBtn" onclick="takePhoto()" aria-label="Take photo">
    <div class="snap-btn-inner"></div>
  </button>

  <canvas id="canvas"></canvas>

  <div class="detect-msg" id="detectMsg"></div>

  <div class="progress-section" id="progressSection">
    <div class="progress-label" id="progressLabel">0 / 3 variations unlocked</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="variant-chips">
      <div class="chip" id="chip0">Birthday hat</div>
      <div class="chip" id="chip1">GOGOOGO Jojo's...i still don't know what that means</div>
      <div class="chip" id="chip2">Saiki K glasses</div>
    </div>
  </div>

  <a class="spotify-btn" id="spotifyBtn" href="https://open.spotify.com/playlist/6RA4M9F6G3pbBjLFPvFlI5?si=72f1a82f7d394c3b" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
      <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.623.623 0 01-.857.208c-2.348-1.435-5.304-1.76-8.785-.964a.623.623 0 11-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.623.623 0 01.207.856zm1.224-2.72a.78.78 0 01-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 01-.973-.519.782.782 0 01.52-.974c3.632-1.102 8.147-.568 11.233 1.329a.78.78 0 01.257 1.073zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.937.937 0 11-.543-1.793c3.538-1.072 9.414-.865 13.127 1.348a.937.937 0 01-.966 1.604z"/>
    </svg>
    open the gift hehehe...
  </a>

</div>

<div class="footer-space"></div>

<script>
function placeholderHTML(n) {
  return `<div class="photo-placeholder">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect x="6" y="10" width="36" height="28" rx="4" stroke="#509689" stroke-width="1.5"/>
      <circle cx="17" cy="21" r="4" stroke="#509689" stroke-width="1.5"/>
      <path d="M6 32l10-8 8 6 6-5 12 9" stroke="#509689" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <span>imgs/${n}.jpg</span>
  </div>`;
}

function buildZigzag() {
  const W = 480, H = 320;
  const z = 10;
  const steps = 18;
  let d = '';
  d += `M 0 ${z} `;
  const topStep = W / steps;
  for (let i = 0; i <= steps; i++) {
    const x = i * topStep;
    const y = (i % 2 === 0) ? 0 : z * 2;
    d += `L ${x} ${y} `;
  }
  d += `L ${W} ${H - z} `;
  for (let i = steps; i >= 0; i--) {
    const x = i * topStep;
    const y = (i % 2 === 0) ? H : H - z * 2;
    d += `L ${x} ${y} `;
  }
  d += `L 0 ${z} Z`;
  document.getElementById('zigPath').setAttribute('d', d);
}
buildZigzag();

function observeElement(el) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) el.classList.add('visible'); });
  }, { threshold: 0.15 });
  io.observe(el);
}
document.querySelectorAll('.parallax-wrapper, .zigzag-section, .camera-section').forEach(observeElement);

const pws = document.querySelectorAll('.parallax-wrapper');
function onScroll() {
  pws.forEach((pw) => {
    const img = pw.querySelector('img');
    if (!img) return;
    const rect = pw.getBoundingClientRect();
    const center = rect.top + rect.height / 2;
    const vCenter = window.innerHeight / 2;
    const offset = (center - vCenter) * 0.18;
    img.style.transform = `translateY(${offset}px) scale(1.1)`;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

// CAMERA
let stream = null;
const videoEl = document.getElementById('videoEl');
const snapBtn = document.getElementById('snapBtn');
const camPrompt = document.getElementById('camPrompt');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

async function startCamera() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    videoEl.srcObject = stream;
    videoEl.classList.add('active');
    camPrompt.style.display = 'none';
    snapBtn.classList.add('show');
    document.getElementById('progressSection').classList.add('show');
    setDetectMsg('Hold an accessory up to the photo and snap! ✨');
  } catch (err) {
    setDetectMsg('Camera permission denied. Please allow camera access.');
  }
}

const VARIANTS = ['hat', 'jojo', 'saiki'];
const VARIANT_NAMES = ['Birthday hat 🎂', "Jojo's GOGO 🌟", 'Saiki K glasses 👓'];
const unlocked = new Set();
let analyzing = false;

async function detectVariant(base64img) {
  const systemPrompt = `You are a paper accessory detector for a birthday game. 

The player is holding paper cutout accessories up to a small printed photo of a child. The accessories are handmade paper cutouts drawn by the birthday organizer. You need to identify which accessory is visible in the image.

The 3 accessories to detect are:

1. "hat" — A paper birthday/party hat cutout. It looks like a cone or triangular hat shape, drawn and cut from paper. It may be held near the top of the photo or anywhere in frame.

2. "jojo" — JoJo's Bizarre Adventure onomatopoeia cutouts. These are stylized Japanese-looking letters or symbols, hand-drawn with bold outlines, colorful (purple/blue/red/orange). They look like manga sound effect text — angular, dramatic lettering. There may be two of them.

3. "saiki" — Saiki K character accessories. These are green rectangular glasses (wide, almost rectangular lens shape) AND two pink round things on sticks (antennas). The glasses and antennas may be separate cutouts placed near each other. Detect this even if they are slightly apart.

IMPORTANT RULES:
- The accessories are paper cutouts held by hand near or against a printed photo — you do NOT need to see them actually attached to anyone's head
- Be GENEROUS in detection — if you can see something that resembles any of these, classify it
- The image may be a little blurry or at an angle — that's fine
- A hand holding the cutout is expected and normal
- If you see multiple accessories, pick the most prominent one

Respond ONLY with a valid JSON object. No explanation, no markdown, just JSON:
{"variant": "hat"} or {"variant": "jojo"} or {"variant": "saiki"} or {"variant": "none"}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 50,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64img } },
            { type: 'text', text: 'Which paper accessory is visible in this image? Reply only with JSON.' }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '{"variant":"none"}';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    return parsed.variant || 'none';
  } catch (err) {
    console.error('Detection error:', err);
    return 'none';
  }
}

async function takePhoto() {
  if (analyzing) return;
  analyzing = true;

  const overlay = document.getElementById('analyzingOverlay');
  overlay.classList.add('show');
  setDetectMsg('Analyzing… ✨');

  canvas.width = videoEl.videoWidth || 640;
  canvas.height = videoEl.videoHeight || 480;
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(videoEl, -canvas.width, 0);
  ctx.restore();

  const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  const variant = await detectVariant(base64);

  overlay.classList.remove('show');
  analyzing = false;

  if (variant !== 'none' && VARIANTS.includes(variant)) {
    const wasNew = !unlocked.has(variant);
    unlocked.add(variant);
    const idx = VARIANTS.indexOf(variant);
    document.getElementById(`chip${idx}`).classList.add('unlocked');

    if (wasNew) {
      setDetectMsg(`${VARIANT_NAMES[idx]} detected! 🎉`);
      updateProgress();
    } else {
      setDetectMsg(`${VARIANT_NAMES[idx]} already found! Try another one ✨`);
    }

    if (unlocked.size === 3) {
      setTimeout(() => {
        setDetectMsg('All 3 variations unlocked! 🌟🎂🌟');
        document.getElementById('spotifyBtn').classList.add('show');
      }, 600);
    }
  } else {
    setDetectMsg("Hmm, couldn't quite catch that one — try holding it closer! 📸");
  }
}

function updateProgress() {
  const count = unlocked.size;
  document.getElementById('progressLabel').textContent = `${count} / 3 variations unlocked`;
  document.getElementById('progressFill').style.width = `${(count / 3) * 100}%`;
}

function setDetectMsg(msg) {
  const el = document.getElementById('detectMsg');
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = msg; el.style.opacity = 1; }, 150);
}
</script>
</body>
</html>
